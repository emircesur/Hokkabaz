[package]
name = "hk-ffi"
description = "Hokkabaz: hk-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# cdylib: desktop + android shared lib; staticlib: ios/macos; lib: cargo check/tests.
crate-type = ["cdylib", "staticlib", "lib"]

[lints]
workspace = true

# Must stay android-safe: no landlock/acp/stdio-spawn deps here.
[dependencies]
flutter_rust_bridge = "=2.11.1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
