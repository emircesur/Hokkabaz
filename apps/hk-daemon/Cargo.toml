[package]
name = "hk-daemon"
description = "Hokkabaz: hk-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hokkabazd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
hk-llm = { version = "0.0.0", path = "../../crates/hk-llm" }
hk-server = { version = "0.0.0", path = "../../crates/hk-server" }
hk-store = { version = "0.0.0", path = "../../crates/hk-store" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tempfile = "3"
