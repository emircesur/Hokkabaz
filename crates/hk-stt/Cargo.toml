[package]
name = "hk-stt"
description = "Hokkabaz: speech-to-text (transcript model, OpenAI-compatible + local whisper transcribers)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Local whisper.cpp via whisper-rs. Off by default: needs cmake + a C++ toolchain.
whisper = ["dep:whisper-rs", "dep:hound"]
# GPU backends for the in-process engine (hk-whisper builds pick one). Vulkan covers NVIDIA, AMD
# and Intel GPUs; it needs the Vulkan SDK at build time.
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]
whisper-cuda = ["whisper", "whisper-rs/cuda"]
whisper-metal = ["whisper", "whisper-rs/metal"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
hk-llm = { version = "0.0.0", path = "../hk-llm" }
hound = { version = "3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "time", "sync"] }
tracing = "0.1"
whisper-rs = { version = "0.16", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
