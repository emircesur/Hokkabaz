[package]
name = "hk-store"
description = "Hokkabaz: hk-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["keyring"]
# OS keyring backend. Off on android (Keystore bridge lands in P6.2).
keyring = ["dep:keyring"]

[dependencies]
# sqlx 0.8 pins libsqlite3-sys 0.30, same as hk-session's rusqlite 0.32: one `links = "sqlite3"` copy.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
