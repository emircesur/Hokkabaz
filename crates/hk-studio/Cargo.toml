[package]
name = "hk-studio"
description = "Hokkabaz Studio: transcript editing, short clips, captions and rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
whisper = ["hk-stt/whisper"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
hk-concat = { path = "../hk-concat" }
hk-flow = { path = "../hk-flow", default-features = false }
hk-llm = { path = "../hk-llm" }
hk-media = { path = "../hk-media" }
hk-store = { path = "../hk-store" }
hk-stt = { path = "../hk-stt" }
hk-tools = { path = "../hk-tools" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
