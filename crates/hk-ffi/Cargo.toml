[package]
name = "hk-ffi"
description = "Hokkabaz: hk-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# cdylib: desktop + android shared lib; staticlib: ios/macos; lib: cargo check/tests.
crate-type = ["cdylib", "staticlib", "lib"]

[lints]
workspace = true

[features]
whisper = ["hk-studio/whisper"]

# Must stay android-safe: no landlock/acp/stdio-spawn deps here. hk-server is pulled with
# default-features off (`runtime` only), so axum never compiles into the app.
[dependencies]
async-trait = "0.1"
flutter_rust_bridge = "=2.11.1"
futures = "0.3"
hk-flow = { version = "0.0.0", path = "../hk-flow" }
hk-llm = { version = "0.0.0", path = "../hk-llm" }
hk-server = { version = "0.0.0", path = "../hk-server", default-features = false, features = ["runtime"] }
hk-session = { version = "0.0.0", path = "../hk-session" }
hk-store = { version = "0.0.0", path = "../hk-store" }
hk-studio = { version = "0.0.0", path = "../hk-studio" }

# RemoteCore transport: rustls + ring only (same stack hk-llm already ships on android), no openssl.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# TLS is layered by hand (tokio-rustls) so the crate needs no extra root-store features.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tracing = "0.1"
webpki-roots = "1"

[dev-dependencies]
# Test-only: boots the real axum surface in-process (never compiled into the app).
hk-server = { version = "0.0.0", path = "../hk-server", features = ["server"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
