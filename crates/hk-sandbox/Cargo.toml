[package]
name = "hk-sandbox"
description = "Hokkabaz: hk-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "hk-sandbox-exec"
path = "src/bin/hk-sandbox-exec.rs"
