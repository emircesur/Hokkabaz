[package]
name = "hk-flow"
description = "Hokkabaz: hk-flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# corpus harness (src/testing.rs); enabled for own integration tests via the self dev-dependency
testing = []
default = ["expr", "http"]
# n8n expression engine (QuickJS via rquickjs; bundled C, cross-compiles to Android)
expr = ["dep:rquickjs", "dep:jmespath", "dep:sha1", "dep:sha2", "dep:md-5"]
# HTTP Request node (reqwest + rustls; builds for Android)
http = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: exported JSON keeps n8n key order, diffs stay readable
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
# retry back-off sleeps
tokio = { version = "1", features = ["time"] }
rquickjs = { version = "0.14", optional = true, default-features = false }
# IANA zones: Luxon-like DateTime in expressions (workflow timezone), Date & Time node, date conditions
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
# Filter `regex` operator, binary payloads
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
# `$jmespath(...)`
jmespath = { version = "0.5", optional = true }
# String.hash() extension
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }

# rquickjs-sys ships no prebuilt bindings for android targets
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14", optional = true, default-features = false, features = ["bindgen"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "test-util", "net", "io-util"] }
# turns `testing` on for tests/ so a plain `cargo test -p hk-flow` runs the corpus
hk-flow = { path = ".", features = ["testing"] }
