[package]
name = "hk-agent"
description = "Hokkabaz: hk-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
futures = "0.3"
hk-core = { version = "0.0.0", path = "../hk-core" }
hk-llm = { version = "0.0.0", path = "../hk-llm" }
hk-session = { version = "0.0.0", path = "../hk-session" }
hk-tools = { version = "0.0.0", path = "../hk-tools" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
