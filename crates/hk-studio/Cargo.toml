[package]
name = "hk-studio"
description = "Hokkabaz Studio: long video to short clips (EDL, captions, reframing, highlights, B-roll, social)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["vision"]
# Face tracking (pure-Rust SeetaFace via rustface); motion tracking is always available.
vision = ["dep:rustface"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
hk-llm = { version = "0.0.0", path = "../hk-llm" }
hk-tools = { version = "0.0.0", path = "../hk-tools" }
hk-media = { version = "0.0.0", path = "../hk-media" }
hk-stt = { version = "0.0.0", path = "../hk-stt" }
hk-store = { version = "0.0.0", path = "../hk-store" }
rustface = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt", "time", "sync", "process"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "fs"] }
