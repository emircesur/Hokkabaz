[workspace]
resolver = "3"
members = ["crates/*", "apps/hk-cli", "apps/hk-daemon"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
# license deferred, see DESIGN D10
license = "LicenseRef-TBD"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
todo = "deny"
unimplemented = "deny"
