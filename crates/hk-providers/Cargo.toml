[package]
name = "hk-providers"
description = "Hokkabaz: provider settings + hot-reloadable router, shared by the app core and hokkabazd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
hk-llm = { version = "0.0.0", path = "../hk-llm" }
hk-store = { version = "0.0.0", path = "../hk-store", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
