name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  lint:
    name: fmt + clippy + check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Tests only for crates whose files changed. Root manifest/lockfile/toolchain
  # or workflow changes fall back to the whole workspace.
  test:
    name: test (changed crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compute changed packages
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$BASE_SHA"; else base="$BEFORE_SHA"; fi
          # new branch / force push: before sha is all zeros or unknown
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD~1"
          fi
          files=$(git diff --name-only "$base" HEAD 2>/dev/null || true)
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qE '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.github/workflows/ci\.yml|wit/)'; then
            echo "args=--workspace" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pkgs=$(echo "$files" | grep -oE '^(crates|apps)/[^/]+' | sort -u | while read -r d; do
            sed -n 's/^name *= *"\(.*\)"/\1/p' "$d/Cargo.toml" 2>/dev/null | head -1
          done | sed 's/^/-p /' | tr '\n' ' ')
          echo "args=$pkgs" >> "$GITHUB_OUTPUT"
      - name: Test
        if: steps.changed.outputs.args != ''
        run: cargo test ${{ steps.changed.outputs.args }}
