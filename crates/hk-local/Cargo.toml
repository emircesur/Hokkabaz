[package]
name = "hk-local"
description = "Hokkabaz: on-device LLMs (GGUF model manager + llama.cpp provider)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# llama.cpp inference via llama-cpp-2. Off by default: needs cmake + a C++ toolchain.
llama = ["dep:llama-cpp-2"]
# Multi-threaded kernels through OpenMP (Linux, Windows).
llama-openmp = ["llama", "llama-cpp-2/openmp"]
# Android: link libc++ statically so the app needs no libc++_shared.so.
llama-android = ["llama", "llama-cpp-2/android-static-stdcxx"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
hk-llm = { version = "0.0.0", path = "../hk-llm" }
hex = "0.4"
llama-cpp-2 = { version = "0.1.160", optional = true, default-features = false, features = ["common"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
