[package]
name = "hk-tools"
description = "Hokkabaz: hk-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
hk-core = { version = "0.0.0", path = "../hk-core" }
jsonschema = { version = "0.59.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.54.0", features = ["sync", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.0", features = ["rt", "macros", "time"] }
