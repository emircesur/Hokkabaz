[workspace]
resolver = "3"
members = ["crates/*", "apps/hk-cli", "apps/hk-daemon", "apps/hk-whisper"]
exclude = ["third_party/concat"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
# AGPL-3.0-or-later since Concat is included (DESIGN D10/D16)
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
todo = "deny"
unimplemented = "deny"

# Size-tuned profile for the Android .so (cargo-ndk / CI: `--profile mobile`).
# panic stays unwind: hk-ffi relies on frb catching panics at the boundary.
# Output dir is target/<triple>/mobile/, not release/.
[profile.mobile]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = false
