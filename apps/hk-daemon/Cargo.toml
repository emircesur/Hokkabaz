[package]
name = "hk-daemon"
description = "Hokkabaz: hk-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "hk_daemon"
path = "src/lib.rs"

[[bin]]
name = "hokkabazd"
path = "src/main.rs"

[lints]
workspace = true

[features]
# built-in integration nodes (hk-integrations `int-*` features decide which)
integrations = ["dep:hk-integrations"]
# WASM plugins installed in <data>/plugins (`hk plugin install`): tools, nodes, polling triggers
plugins = ["integrations", "dep:hk-plugin", "dep:hk-tools"]
# Video Studio for remote apps (`/api/v1/studio`); needs ffmpeg on the host.
studio = ["dep:hk-studio", "dep:hk-media", "dep:futures"]
# On-device GGUF models served by this instance (provider `local`; `hokkabazd models pull`).
# Needs cmake + a C++ toolchain at build time; off by default.
local-llm = ["dep:hk-local", "hk-local/llama-openmp"]
# GPU offload for local models (needs the Vulkan SDK / CUDA toolkit at build time).
local-llm-vulkan = ["local-llm", "hk-local/llama-vulkan"]
local-llm-cuda = ["local-llm", "hk-local/llama-cuda"]
default = ["integrations", "plugins", "studio"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
hk-flow = { version = "0.0.0", path = "../../crates/hk-flow" }
hk-integrations = { version = "0.0.0", path = "../../crates/hk-integrations", optional = true }
hk-studio = { version = "0.0.0", path = "../../crates/hk-studio", optional = true }
futures = { version = "0.3", optional = true }
hk-media = { version = "0.0.0", path = "../../crates/hk-media", optional = true }
hk-plugin = { version = "0.0.0", path = "../../crates/hk-plugin", optional = true }
hk-tools = { version = "0.0.0", path = "../../crates/hk-tools", optional = true }
hk-llm = { version = "0.0.0", path = "../../crates/hk-llm" }
hk-local = { version = "0.0.0", path = "../../crates/hk-local", optional = true }
hk-providers = { version = "0.0.0", path = "../../crates/hk-providers" }
hk-server = { version = "0.0.0", path = "../../crates/hk-server" }
hk-store = { version = "0.0.0", path = "../../crates/hk-store" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1"] }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
