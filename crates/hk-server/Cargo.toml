[package]
name = "hk-server"
description = "Hokkabaz: hk-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["server"]
# In-process agent runtime (LocalRuntime + AgentRuntime trait). No HTTP stack: android/ffi embed this.
runtime = [
  "dep:async-trait",
  "dep:hk-agent",
  "dep:hk-core",
  "dep:hk-llm",
  "dep:hk-session",
  "dep:hk-tools",
  "dep:hk-studio",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:tokio",
  "dep:tracing",
]
# HTTP/WS surface on top of `runtime`. Off => nothing pulls axum on targets that never serve.
server = [
  "runtime",
  "dep:axum",
  "dep:futures",
  "dep:hk-store",
  "dep:subtle",
  "dep:getrandom",
  "dep:hk-flow",
  "dep:hmac",
  "dep:sha2",
  "dep:sha1",
  "dep:base64",
  "dep:form_urlencoded",
  "dep:utoipa",
  "dep:qrcode",
  "tokio/net",
]

[dependencies]
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
base64 = { version = "0.22", optional = true }
form_urlencoded = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
qrcode = { version = "0.14", optional = true, default-features = false, features = ["svg"] }
utoipa = { version = "5", optional = true, default-features = false, features = ["macros"] }
getrandom = { version = "0.3", optional = true }
hk-agent = { version = "0.0.0", path = "../hk-agent", optional = true }
hk-core = { version = "0.0.0", path = "../hk-core", optional = true }
# Webhook response types (ResponseSink etc.) and workflow validation only; no QuickJS/reqwest here.
hk-flow = { version = "0.0.0", path = "../hk-flow", optional = true, default-features = false }
hk-llm = { version = "0.0.0", path = "../hk-llm", optional = true }
hk-session = { version = "0.0.0", path = "../hk-session", optional = true }
hk-store = { version = "0.0.0", path = "../hk-store", optional = true }
hk-tools = { version = "0.0.0", path = "../hk-tools", optional = true }
hk-studio = { version = "0.0.0", path = "../hk-studio", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
subtle = { version = "2", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
