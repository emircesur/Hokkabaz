name: windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Runs on every push of the working branch so a Windows build is always waiting in Actions.
    branches: ["claude/amazing-fermat-ykjmuh"]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      # bindgen (llama.cpp, QuickJS) needs libclang; the runner image ships LLVM here.
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      # llama.cpp's CMake tree exceeds MAX_PATH under the default build dir.
      HK_CARGO_TARGET_DIR: 'C:\hkt'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # hk-concat's optional path deps need third_party/concat on disk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install Vulkan SDK
        # GPU build of whisper.cpp (hk-whisper.exe) compiles its Vulkan backend against it. At run time
        # it only needs vulkan-1.dll, which every GPU driver ships (and the app bundles).
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.313.2
        run: |
          $exe = "$env:RUNNER_TEMP\vulkansdk.exe"
          curl.exe -sSfL -o $exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          Start-Process -FilePath $exe -ArgumentList '--root','C:\VulkanSDK','--accept-licenses','--default-answer','--confirm-command','install' -Wait -NoNewWindow
          if (-not (Test-Path 'C:\VulkanSDK\Bin\glslc.exe')) { Get-ChildItem C:\VulkanSDK; throw 'Vulkan SDK install failed' }
          Add-Content $env:GITHUB_ENV 'VULKAN_SDK=C:\VulkanSDK'
          Add-Content $env:GITHUB_PATH 'C:\VulkanSDK\Bin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: apps/flutter
        run: flutter pub get
      - name: Build Windows release
        working-directory: apps/flutter
        run: flutter build windows --release
      # whisper.cpp ships as its own executable (llama.cpp in the app has another ggml copy).
      - name: Build hk-whisper helper
        shell: pwsh
        env:
          CARGO_TARGET_DIR: 'C:\hkw'
        run: |
          # GPU (Vulkan) helper; if that build breaks, ship the CPU one rather than no helper.
          cargo build --release -p hk-whisper --features vulkan
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::hk-whisper Vulkan build failed; shipping the CPU helper"
            cargo build --release -p hk-whisper
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Copy-Item C:\hkw\release\hk-whisper.exe apps/flutter/build/windows/x64/runner/Release/
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path apps/flutter/build/windows/x64/runner/Release/* -DestinationPath hokkabaz-windows-x64.zip
      - name: Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=0.0.0" packaging/windows.iss
      - uses: actions/upload-artifact@v4
        with:
          name: hokkabaz-windows-x64
          path: |
            hokkabaz-windows-x64.zip
            dist/hokkabaz-windows-x64-setup.exe
          if-no-files-found: error

  # Not shipped yet: shows whether llama.cpp's Vulkan backend builds here, with the full log.
  llama-vulkan:
    runs-on: windows-latest
    continue-on-error: true
    env:
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
      CARGO_TARGET_DIR: 'C:\hlv'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan SDK
        # GPU build of whisper.cpp (hk-whisper.exe) compiles its Vulkan backend against it. At run time
        # it only needs vulkan-1.dll, which every GPU driver ships (and the app bundles).
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.313.2
        run: |
          $exe = "$env:RUNNER_TEMP\vulkansdk.exe"
          curl.exe -sSfL -o $exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          Start-Process -FilePath $exe -ArgumentList '--root','C:\VulkanSDK','--accept-licenses','--default-answer','--confirm-command','install' -Wait -NoNewWindow
          if (-not (Test-Path 'C:\VulkanSDK\Bin\glslc.exe')) { Get-ChildItem C:\VulkanSDK; throw 'Vulkan SDK install failed' }
          Add-Content $env:GITHUB_ENV 'VULKAN_SDK=C:\VulkanSDK'
          Add-Content $env:GITHUB_PATH 'C:\VulkanSDK\Bin'
      - name: Build hk-local with llama-vulkan
        shell: pwsh
        run: cargo build --release -p hk-local --features llama-openmp,llama-vulkan -vv 2>&1 | Select-Object -Last 400
      - name: CMake logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse C:\hlv -Include *.log -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'vulkan-shaders-gen' } |
            ForEach-Object { "==== $($_.FullName)"; Get-Content $_ -Tail 80 }
