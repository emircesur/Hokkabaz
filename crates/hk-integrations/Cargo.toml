[package]
name = "hk-integrations"
description = "Hokkabaz: hk-integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# Pure-HTTP integrations are android-safe, so they are on by default. An integration that
# needs a native dep must gate it with cfg(not(target_os = "android")) and stay out of here.
default = ["all-integrations"]
all-integrations = ["int-ntfy", "int-github", "int-gitea", "int-git", "int-n8n", "int-telegram", "int-matrix", "int-gotify", "int-email", "int-rss", "int-sqlite", "int-postgres", "int-redis", "int-s3", "int-searxng", "int-ollama", "int-slack", "int-saas", "int-mysql", "int-mqtt", "int-rabbitmq", "int-ftp", "int-ssh", "int-kafka", "int-mongodb"]
# ntfy.sh: send notification
int-ntfy = []
# GitHub node + polling GitHub Trigger
int-github = []
# Gitea / Forgejo node
int-gitea = []
# Git node (git CLI via tokio::process; desktop only, android build returns an unsupported error)
int-git = []
# n8n node (public API of another n8n instance)
int-n8n = []
# Telegram Bot API node + getUpdates polling trigger
int-telegram = []
# Matrix client-server API node
int-matrix = []
# Gotify push server node
int-gotify = []
# SMTP Send Email + IMAP Email Trigger (lettre / async-imap over tokio-rustls, ring; no openssl)
int-email = ["dep:lettre", "dep:async-imap", "dep:mail-parser", "dep:tokio-rustls", "dep:webpki-roots", "dep:futures-util", "tokio/net", "tokio/io-util"]
# RSS Feed Read + RSS Feed Trigger (feed-rs)
int-rss = ["dep:feed-rs"]
# SQLite node (rusqlite, bundled sqlite: same libsqlite3-sys copy as hk-session / sqlx)
int-sqlite = ["dep:rusqlite"]
# PostgreSQL node (tokio-postgres over tokio-rustls/ring; no openssl)
int-postgres = ["dep:tokio-postgres", "dep:bytes", "dep:tokio-postgres-rustls", "dep:tokio-rustls", "dep:webpki-roots", "tokio/net", "tokio/io-util"]
# Redis node (tiny RESP2 client over tokio TCP, optional rustls)
int-redis = ["dep:tokio-rustls", "dep:webpki-roots", "tokio/net", "tokio/io-util"]
# S3 / MinIO node (hand-rolled SigV4 over reqwest; no aws-sdk)
int-s3 = ["dep:hmac", "dep:sha2"]
# SearXNG node + `web_search` agent tool
int-searxng = ["dep:hk-tools"]
# Ollama node
int-ollama = []
# MySQL / MariaDB node (mysql_async over rustls; pure Rust)
int-mysql = ["dep:mysql_async"]
# MQTT publish / receive
int-mqtt = ["dep:rumqttc"]
# RabbitMQ (AMQP 0-9-1) send / get
int-rabbitmq = ["dep:lapin"]
# FTP (own minimal client, plain FTP)
int-ftp = ["tokio/net", "tokio/io-util"]
# SSH: run commands (russh)
int-ssh = ["dep:russh"]
# Kafka produce / fetch (rskafka, pure Rust)
int-kafka = ["dep:rskafka"]
# MongoDB (official driver; desktop builds)
int-mongodb = ["dep:mongodb"]
# Slack node (Web API, bot token)
int-slack = []
# Data-driven REST integrations: crates/hk-integrations/specs/*.json (Notion, Stripe, Anthropic, Google, ...)
int-saas = ["dep:hmac", "dep:sha2", "dep:getrandom", "tokio/net", "tokio/io-util", "tokio/macros"]

[dependencies]
# expr: node parameters (`={{ ... }}`) evaluate through the QuickJS engine; http: shared reqwest stack
hk-flow = { version = "0.0.0", path = "../hk-flow", default-features = false, features = ["expr", "http"] }
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "rt", "sync", "process"] }
tracing = "0.1"
base64 = "0.22"
# int-email: pure-Rust mail stack. ring + webpki-roots keep it off openssl/aws-lc (android-safe).
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"], optional = true }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"], optional = true }
mail-parser = { version = "0.11", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
# int-rss
feed-rs = { version = "3", optional = true }
# int-sqlite: same version/features as hk-session so the workspace links one sqlite3 copy
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# int-postgres
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"], optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }
bytes = { version = "1", optional = true }
# int-s3
hmac = { version = "0.12", optional = true }
# int-saas: OAuth sign-in (PKCE verifier, state)
getrandom = { version = "0.3", optional = true }
sha2 = { version = "0.10", optional = true }
# int-searxng: `web_search` implements the hk-tools `Tool` trait (no pty / web-fetch needed)
hk-tools = { version = "0.0.0", path = "../hk-tools", default-features = false, optional = true }
mysql_async = { version = "0.35", default-features = false, features = ["minimal", "rustls-tls"], optional = true }
rumqttc = { version = "0.24", optional = true }
lapin = { version = "2", optional = true }
russh = { version = "0.63.1", default-features = false, features = ["flate2", "ring", "rsa"], optional = true }
rskafka = { version = "0.6.0", default-features = false, features = ["transport-tls"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "test-util", "net", "io-util"] }

# MongoDB's driver is large: desktop and server builds only.
[target.'cfg(not(target_os = "android"))'.dependencies]
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "compat-3-0-0"], optional = true }
